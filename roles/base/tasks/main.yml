- name: (base) install packages
  tags:
    - base
    - packages
  community.general.pacman:
    name: "{{ item }}"
    state: latest
  loop:
    - ansible
    - firefox
    - flameshot
    - btop
    - nano
    - networkmanager
    - ntfs-3g
    - os-prober
    - pipewire
    - pipewire-alsa
    - wireplumber
    - pipewire-jack
    - pipewire-pulse
    - bluez
    - bluez-utils
    - sof-firmware
    - linux-firmware
    - sudo
    - thunar
    - gvfs
    - gvfs-mtp
    - libmtp
    - mtpfs
    - tumbler
    - ffmpegthumbnailer
    - python-watchdog
    - base-devel
    - xclip
    - xsel
    - redshift
    - playerctl
    - brightnessctl
    - ranger
    - zenity
    - xf86-video-amdgpu
    - mesa
    - vulkan-radeon
    - libva-mesa-driver
    - python-dbus-fast
    - viewnior
    - pfetch-rs
    - alsa-utils
    - otf-font-awesome

- name: (AUR) install packages using yay
  become: false
  tags:
    - base
    - packages
  ansible.builtin.command: yay -S --noconfirm --needed --answerclean None --answerdiff None nitrogen pywal-git

- name: (flameshot) configure X11 legacy screenshot mode
  become: false
  tags:
    - base
    - files
  community.general.ini_file:
    path: "/home/{{ ansible_user }}/.config/flameshot/flameshot.ini"
    section: General
    option: useX11LegacyScreenshot
    value: "true"
    create: yes
